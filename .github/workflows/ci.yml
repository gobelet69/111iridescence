name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Astro Check
        run: npm run check

      - name: Run Unit Tests (Vitest)
        run: npm run test:unit

      - name: Build static distribution
        run: npm run build

      - name: Verify static build artifacts
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/fr/index.html
          echo "✓ 111iridescence website build validated successfully."
